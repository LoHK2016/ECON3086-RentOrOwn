[project]
name = "rentorbuy"
version = "0.1.0"
description = "Compare buying a Hong Kong home with renting it"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "yfinance>=1.8.0",
    "pandas>=3.1.1",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=8",
]

[tool.uv]
package = false
