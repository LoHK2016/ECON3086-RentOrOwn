# Runs the Python tests, builds the site and publishes it to GitHub Pages.
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the tests
        run: |
          pip install requests beautifulsoup4 pandas numpy statsmodels
          python tests/test_calc.py
          python tests/test_valuation.py
          python tests/test_daily.py
          python tests/test_scrapers.py
          python tests/test_banks.py
          python tests/test_deposits.py
          python tests/test_etf_returns.py
          python tests/test_centaline.py
          python tests/test_market_benchmarks.py
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the site
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
